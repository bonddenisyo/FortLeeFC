<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fort Lee FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a href="#/events" class="brand">
      <span class="brand__mark">◎</span>
      <span class="brand__name">Fort Lee FC</span>
    </a>
    <nav class="topbar__nav">
      <a href="#/events">Games</a>
      <a href="#/new" id="nav-new" class="hidden">Create a game</a>
    </nav>
    <button class="identity" id="identity-btn">Sign in</button>
  </div>
</header>

<main id="app" class="app"></main>


<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
